<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saser Hotel, Leh Ladakh</title>
    <style>
        /* Reset default browser margins */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Center the container on the full screen */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa; /* Light gray background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Stack the logo and text vertically and center them */
        .brand-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Space between logo and name */
        }

        /* Style the logo */
        .logo {
            width: 120px; /* Adjust size as needed */
            height: auto;
            border-radius: 8px; /* Optional: rounds the corners of your logo */
        }

        /* Style the brand name */
        .brand-name {
            font-size: 2rem;
            color: #333333;
            font-weight: 600;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="brand-container">
        <!-- Replace 'logo.png' with your actual image path or URL -->
        <img src="img/saser.png" alt="Saser Logo" class="logo">
        <h1 class="brand-name">Saser Hotel</h1>
    </div>

</body>
</html>
