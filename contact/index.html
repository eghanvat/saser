<!DOCTYPE html>
<html lang="en">

<head>
  <title>Saser Hotel Leh Ladhak - Contact </title>
  <link rel="stylesheet" href="/css/load.css">
  <script src="/js/jquery.js"></script>
  <script src="/js/load.js"></script>
</head>

<body>
  <div class="wrap">
    <header class="page-head">
      <h1>Get in touch</h1>
      <p class="sub">Questions, bookings, or just to say hello.</p>
    </header>

    <div class="contact-card">
      <div class="photo-frame" onclick="openLightbox()">
        <img src="/img/sonam.jpg" alt="Sonam Tundup">
        <div class="photo-hint">Tap to enlarge</div>
      </div>

      <div class="details">
        <h2>Sonam Tundup</h2>
        <p class="role">Proprietor</p>

        <div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-value"><a href="tel:+919797578181">+91 97975 78181</a></span>
          <span class='alt'>alt</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value"><a href="mailto:tundup534@gmail.com">tundup534@gmail.com</a></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Instagram</span>
          <span class="detail-value">
            <a class="insta-link" href="https://www.instagram.com/sotnamdhundup" target="_blank" rel="noopener">
              sotnamdhundup
            </a>
          </span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Facebook</span>
          <span class="detail-value"><a href="https://www.facebook.com/sonam.tundup1">sonam.tundup1</a></span>
        </div>
      </div>
    </div>
  </div>

  <footer class="wrap">
    <span>Saser</span>
  </footer>
  <div class="lightbox" id="altnobox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <div class="altno">
      <div class="detail-row">
        <span class="detail-label">Pramod</span>
        <spam class="detail-value"><a href="tel:+919906035666">+91 99060 35666</a></spam>
      </div>
      <div class="detail-row">
        <span class="detail-label">Lobzan</span>
        <spam class="detail-value"><a href="tel:+918082181659">+91 80821 81659</a></spam>
      </div>
    </div>
  </div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <img src="/img/sonam.jpg" alt="Sonam Tundup — full photo">
  </div>

  <script>
    function openLightbox() {
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox(e) {
      if (e) e.stopPropagation();
      $('.lightbox').removeClass('open');
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    $('.alt').click(function () {
      $('#altnobox').addClass('open');
    })
  </script>

</body>

</html>
