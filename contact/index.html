<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Saser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link href="../css/saser.css" rel="stylesheet">
    <link href="../css/contact.css" rel="stylesheet">
  <script src="../js/jquery.js"></script>
  <script src="../js/saser.js" type="module"></script>
  <style>

  </style>
</head>

<body>

  <div class="topbar">
    <div class="spacer"></div>
    <div class="username"></div>
    <button class="logoutBtn">Logout</button>
  </div>

  <nav class="wrap">
    <div class="brand"><a href="/"><img src="../img/saser_logo.png" alt="Saser" style="height:64px; display:block;"></div>
    <div class="nav-links">
      <a href="/menu/">Menu</a>
      <a href="/contact/index.html">Contact</a>
      <a href="/auth/login.html">Login</a>
      <a class="insta-link" href="https://www.instagram.com/saser_leh" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.6" />
          <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor" />
        </svg>
      </a>
    </div>
    </div>
  </nav>

  <div class="wrap">
    <header class="page-head">
      <h1>Get in touch</h1>
      <p class="sub">Questions, bookings, or just to say hello.</p>
    </header>

    <div class="contact-card">
      <div class="photo-frame" onclick="openLightbox()">
        <img src="../img/sonam.jpg" alt="Sonam Tundup">
        <div class="photo-hint">Tap to enlarge</div>
      </div>

      <div class="details">
        <h2>Sonam Tundup</h2>
        <p class="role">Proprietor</p>

        <div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-value"><a href="tel:+919797578181">+91 97975 78181</a></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value"><a href="mailto:tundup534@gmail.com">tundup534@gmail.com</a></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Instagram</span>
          <span class="detail-value">
            <a class="insta-link" href="https://www.instagram.com/sotnamdhundup" target="_blank" rel="noopener">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6" />
                <circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.6" />
                <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor" />
              </svg>
              @sotnamdhundup
            </a>
          </span>
        </div>
      </div>
    </div>
  </div>

  <footer class="wrap">
    <span>Saser</span>
  </footer>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <img src="../img/sonam.jpg" alt="Sonam Tundup — full photo">
  </div>

  <script>
    function openLightbox() {
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox(e) {
      if (e) e.stopPropagation();
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>

</html>
