<!DOCTYPE html>
<html lang="en">

<head>
  <title>Saser Hotel Leh Ladhak - Hotel Owner </title>
  <link rel="stylesheet" href="/css/load.css">
  <script src="/js/jquery.js"></script>
  <script src="/js/jquery-ui.min.js"></script>
  <script src="/js/load.js"></script>
</head>

<body>

  <nav class="wrap">
    <div class="brand">Saser — Kitchen</div>
    <button id="test">Beep</button>
    <div style="display:flex; align-items:center; gap:12px; font-size:0.85rem;">
      <span id="staff-email"></span>
      <button onclick="signOut()" class="logoutBtn">
    </div>
  </nav>


  <div class="wrap">
    <h1>Live orders</h1>`
    <p class="sub">Updates every few seconds — no need to refresh.</p>

    <div class="tabs" id="tabs">
      <button data-filter="active" class="active">Active</button>
      <button data-filter="preparing">Preparing</button>
      <button data-filter="placed">Preparing</button>
      <button data-filter="ready">Ready</button>
      <button data-filter="cancelled">Cancelled</button>

    </div>

    <div id="orders-root" class="grid">
      <div class="empty">Loading…</div>
    </div>
  </div>



</body>

</html>
