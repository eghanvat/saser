<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen — Saser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/kitchen.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="wrap">
  <div class="brand">Saser — Kitchen</div>
  <div style="display:flex; align-items:center; gap:12px; font-size:0.85rem;">
    <span id="staff-email"></span>
    <button onclick="supabase.auth.signOut().then(() => location.href='login.html')" style="background:none; border:1px solid var(--rust); color:var(--rust); padding:5px 12px; border-radius:4px; cursor:pointer;">Log out</button>
  </div>
</nav>

  
<div class="wrap">
  <h1>Live orders</h1>
  <p class="sub">Updates every few seconds — no need to refresh.</p>

  <div class="tabs" id="tabs">
    <button data-filter="active" class="active">Active</button>
    <button data-filter="placed">Placed</button>
    <button data-filter="preparing">Preparing</button>
    <button data-filter="ready">Ready</button>
    <button data-filter="cancelled">Cancelled</button>
  </div>

  <div id="orders-root" class="grid"><div class="empty">Loading…</div></div>
</div>

<script src="../js/kitchen.js"></script>
</body>
</html>
