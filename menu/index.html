<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Saser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../css/menu.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="wrap">
  <div class="brand"><a href="/"><img src="../img/saser_logo.png" alt="Saser" style="height:64px; display:block;"></div>
  <div class="nav-links"><a href="/">← Back home</a></div>
</nav>

<div class="wrap">
  <header class="page-head">
    <h1>Menu</h1>
    <p class="sub">Straight from the kitchen — updated by staff, no reprinting needed.</p>
  </header>

  <div id="status" class="status">Loading menu…</div>
  <div id="context-banner" style="display:none;"></div>
  <div id="cart-bar"></div>
  <div id="cart-dropdown"></div>
  <div id="category-nav" class="category-nav"></div>
  <div id="menu-root"></div>
</div>

<footer class="wrap">
  <span class="dot veg" style="margin-right:6px;"></span> Veg &nbsp;&nbsp;
  <span class="dot nonveg" style="margin-right:6px;"></span> Non-veg
</footer>

  
<script src="../js/fallback-menu.js"></script>
<script src="../js/menu.js"></script>

</body>
</html>
