<!DOCTYPE html>
<html lang="en">

<head>
  <title>Saser Hotel Leh Ladhak - Menu </title>
  <link rel="stylesheet" href="/css/load.css">
  <script src="/js/jquery.js"></script>
  <script src="/js/jquery-ui.min.js"></script>
  <script src="/js/load.js"></script>
</head>

<body>
  <div class="wrap">
    <div id="cart-bar"></div>
    <header class="page-head">
      <h1>Menu</h1>
      <p class="sub">Straight from the kitchen — updated by staff, no reprinting needed.</p>
    </header>

    <div id="status" class="center-load">
      <div class="spinner" id="spinner"></div>
      <div class="msg-load">Loading menu…</div>
    </div>
    <div id="context-banner" style="display:none;"></div>

    <div id="cart-dropdown"></div>
    <div id="category-nav" class="category-nav"></div>
    <div id="menu-root"></div>
  </div>

  <footer class="wrap">
    <span class="dot veg" style="margin-right:6px;"></span> Veg &nbsp;&nbsp;
    <span class="dot nonveg" style="margin-right:6px;"></span> Non-veg
  </footer>


  <script src="../js/fallback-menu.js"></script>

</body>

</html>
