<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your order — Saser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/order-status.css"></style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
</head>
<body>

<nav class="wrap">
  <div class="brand"><a href="/"><img src="../img/saser_logo.png" alt="Saser" style="height:56px; display:block;"></a></div>
</nav>

<div class="wrap">
  <header>
    <h1>Your order</h1>
    <p class="meta" id="order-meta">Loading…</p>
  </header>

  <div class="status-card" id="status-card">
    <div class="spinner" id="spinner"></div>
    <p class="status-label" id="status-label">Waiting for kitchen</p>
    <p class="status-sub" id="status-sub">Your order has been sent through</p>
    <p class="countdown" id="countdown" style="display:none;">--:--</p>
    <button class="cancel-btn" id="cancel-btn">Cancel order</button>
    <button class="cancel-btn" id="bring-btn" style="display:none; border-color:var(--pine); color:var(--pine);">Bring it now</button>
  </div>

  <div class="items">
    <h2>Items</h2>
    <div id="items-list">Loading…</div>
    <div class="order-total" id="order-total" style="display:none;"></div>
  </div>

  <a class="back-link" href="/menu.html">← Back to menu</a>
</div>

  <script src="../js/order-status.js"></script>


</body>
</html>
