<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your order — Saser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/order-status.css">
  </style>
  <script src="../js/jquery.js"></script>
  <script type="module" src="../js/saser.js"></script>
</head>

<body>

  <div class="topbar">
    <div class="spacer"></div>
    <div class="username">Sujeet Ghanvat</div>
    <button class="logoutBtn">Logout</button>
  </div>
  <nav class="wrap">
    <div class="brand"><a href="/"><img src="../img/saser_logo.png" alt="Saser" style="height:64px; display:block;"></div>
    <div class="nav-links">
      <a href="/menu/">Menu</a>
      <a href="/contact/index.html">Contact</a>
      <a href="/auth/login.html">Login</a>
      <a class="insta-link" href="https://www.instagram.com/saser_leh" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="1.6" />
          <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor" />
        </svg>
      </a>
    </div>
    </div>
  </nav>

  <div class="wrap">
    <header>
      <h1>Your order</h1>
      <p class="meta" id="order-meta">Loading…</p>
    </header>

    <div class="status-card" id="status-card">
      <div class="spinner" id="spinner"></div>
      <p class="status-label" id="status-label">Waiting for kitchen</p>
      <p class="status-sub" id="status-sub">Your order has been sent through</p>
      <p class="countdown" id="countdown" style="display:none;">--:--</p>
      <button class="cancel-btn" id="cancel-btn">Cancel order</button>
      <button class="cancel-btn" id="bring-btn" style="display:none; border-color:var(--pine); color:var(--pine);">Bring
        it now</button>
    </div>

    <div class="items">
      <h2>Items</h2>
      <div id="items-list">Loading…</div>
      <div class="order-total" id="order-total" style="display:none;"></div>
    </div>

    <a class="back-link" href="/menu.html">← Back to menu</a>
  </div>

  <script src="../js/order-status.js"></script>


</body>

</html>
