<!DOCTYPE html>
<html lang="en">

<head>
  <title>Saser Hotel Leh Ladhak - Order Status</title>
  <link rel="stylesheet" href="/css/load.css">
  <script src="/js/jquery.js"></script>
  <script src="/js/load.js"></script>
</head>

<body>
  <div class="wrap-d">
    <header>
      <h1>Your order</h1>
      <p class="meta" id="order-meta">Loading…</p>
    </header>

    <div class="status-card" id="status-card">
      <div class="spinner" id="spinner"></div>
      <p class="status-label" id="status-label">Waiting for kitchen</p>
      <p class="status-sub" id="status-sub">Your order has been sent through</p>
      <p class="countdown" id="countdown" style="display:none;">--:--</p>
      <button class="cancel-btn" id="cancel-btn">Cancel order</button>
      <button class="cancel-btn" id="bring-btn" style="display:none; border-color:var(--pine); color:var(--pine);">Bring
        it now</button>
    </div>

    <div class="items">
      <h2>Items</h2>
      <div id="items-list">Loading…</div>
      <div class="order-total" id="order-total" style="display:none;"></div>
    </div>

    <a class="back-link" href="/menu.html">← Back to menu</a>
  </div>

  <script src="../js/order-status.js"></script>


</body>

</html>
