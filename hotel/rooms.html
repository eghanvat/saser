<!DOCTYPE html>
<html lang="en">

<head>
    <title>Saser Hotel Leh Ladhak - Rooms </title>
    <link rel="stylesheet" href="/css/load.css">
    <script src="/js/jquery.js"></script>
    <script src="/js/load.js"></script>
</head>

<body>
    <div id="main"></div>
    <div class="wrap-sm">
        <h1>Rooms</h1>
        <div class="legend" id="legend"></div>
        <div id="floors">
            <div class="msg">Loading rooms…</div>
        </div>
    </div>

    <dialog id="sheet">
        <div class="title" data-status="occupied">
            <button class="action" type="button"></button>
            <h3 id="sheet-title"></h3>
            <p class="sub" id="sheet-sub"></p>
        </div>
        <div class="in-room">
            <h4>In this room</h4>
            <div class="list" id="in-room"></div>
        </div>
        <div class="add-guest">
            <h4>Add guest</h4>
            <input id="q" type="search" placeholder="Search name, email or phone. 3+ characters" autocomplete="off">
            <div class="list" id="recent"></div>
            <div id="newbox"></div>
            <h4>Price : <input type="text" class="price-box" /></h4>
        </div>
        <div class="room-status">
            <h4>Change Room status</h4>
            <div class="opts" id="sheet-opts"></div>
        </div>

        <button class="cancel" id="sheet-cancel" type="button">Close</button>
    </dialog>
    <div id="toast" role="status" aria-live="polite" popover="manual"></div>
</body>

</html>
