<!DOCTYPE html>
<html lang="en">

<head>
    <title>Saser Hotel Leh Ladhak - Menu </title>
    <link rel="stylesheet" href="/css/load.css">
    <script src="/js/jquery.js"></script>
    <script src="/js/load.js"></script>
</head>

<body>
    <div class="wrap-sm">
        <h1>Rooms</h1>
        <div class="legend" id="legend"></div>
        <div id="floors">
            <div class="msg">Loading rooms…</div>
        </div>
    </div>

    <dialog id="sheet">
        <h3 id="sheet-title"></h3>
        <p class="sub" id="sheet-sub"></p>

        <h4>In this room</h4>
        <div class="list" id="in-room"></div>

        <h4>Price : <input type="text" class="price-box" /></h4>

        <h4>Add guest <small>recent logins, or search anyone</small></h4>
        <input id="q" type="search" placeholder="Search name, email or phone" autocomplete="off">
        <div class="list" id="recent"></div>
        <div id="newbox"></div>

        <h4>Room status</h4>
        <div class="opts" id="sheet-opts"></div>

        <button class="cancel" id="sheet-cancel" type="button">Close</button>
    </dialog>
    <div id="toast" role="status" aria-live="polite" popover="manual"></div>
</body>

</html>
