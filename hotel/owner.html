<!DOCTYPE html>
<html lang="en">

<head>
    <title>Saser Hotel Leh Ladhak - Hotel Owner </title>
    <link rel="stylesheet" href="/css/load.css">
    <script src="/js/jquery.js"></script>
    <script src="/js/jquery-ui.min.js"></script>
    <script src="/js/load.js"></script>
</head>

<body>
    <a href="https://www.saser.in/kitchen/">Kitchen</a>

    <div class="wrap-sm">
        <div id="owner"></div>
        <div class="staff">
            <input type="email" placeholder="Email" />
            <input type="text" placeholder="Phone" />
            <select id="type">
                <option>Cook</option>
                <option>Help</option>
                <option>Admin</option>
            </select>
            <button>Add</button>
        </div>
    </div>

    <h1>Rooms</h1>
    <div class="legend" id="legend"></div>
    <div id="floors">
        <div class="msg">Loading rooms…</div>
    </div>

    <dialog id="sheet">
        <h3 id="sheet-title"></h3>
        <p id="sheet-sub"></p>
        <div class="opts" id="sheet-opts"></div>
        <button class="cancel" id="sheet-cancel" type="button">Close</button>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>


</body>

</html>
