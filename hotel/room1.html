<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rooms</title>
    <script type="module" src="/js/jquery.js"></script>
    <style>
        :root {
            --bg: #f2f4f6;
            --card: #ffffff;
            --ink: #18212b;
            --muted: #5d6b79;
            --line: #d9dfe5;
            --available: #1f8a4c;
            --on-available: #ffffff;
            --occupied: #c8372d;
            --on-occupied: #ffffff;
            --cleaning: #e3a82b;
            --on-cleaning: #2b1d00;
            --maintenance: #586474;
            --on-maintenance: #ffffff;
            --other: #7a4fb5;
            --on-other: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12171c;
                --card: #1b232b;
                --ink: #e8edf2;
                --muted: #9aa8b6;
                --line: #2c3743;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
            padding: 16px 16px 80px;
            max-width: 760px;
            margin-inline: auto;
        }

        h1 {
            font-size: 22px;
            margin: 4px 0 12px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 14px;
        }

        .chip i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--c);
            display: inline-block;
        }

        .chip b {
            font-weight: 700;
        }

        .floor {
            margin-bottom: 26px;
        }

        .floor-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .floor-head h2 {
            font-size: 18px;
            margin: 0;
        }

        .floor-head span {
            color: var(--muted);
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 10px;
        }

        .room {
            --c: var(--other);
            --on: var(--on-other);
            background: var(--c);
            color: var(--on);
            border: 0;
            border-radius: 12px;
            min-height: 84px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

        .room .no {
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        .room .type {
            font-size: 13px;
            opacity: .92;
        }

        .room:active {
            transform: scale(.97);
        }

        .room:focus-visible,
        .opt:focus-visible,
        .act:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px;
        }

        [data-status="available"] {
            --c: var(--available);
            --on: var(--on-available);
        }

        [data-status="occupied"] {
            --c: var(--occupied);
            --on: var(--on-occupied);
        }

        [data-status="cleaning"] {
            --c: var(--cleaning);
            --on: var(--on-cleaning);
        }

        [data-status="maintenance"] {
            --c: var(--maintenance);
            --on: var(--on-maintenance);
        }

        [data-status="other"] {
            --c: var(--other);
            --on: var(--on-other);
        }

        dialog {
            border: 0;
            border-radius: 16px;
            padding: 18px;
            width: min(400px, 100vw);
            max-height: 92vh;
            overflow-y: auto;
            background: var(--card);
            color: var(--ink);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, .5);
        }

        dialog h3 {
            margin: 0 0 2px;
            font-size: 20px;
        }

        dialog .sub {
            margin: 0 0 6px;
            color: var(--muted);
            font-size: 14px;
        }

        dialog h4 {
            margin: 18px 0 8px;
            font-size: 15px;
        }

        dialog h4 small {
            font-weight: 400;
            color: var(--muted);
        }

        .list {
            display: grid;
            gap: 8px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .who {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .who b {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .who span {
            color: var(--muted);
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .act {
            flex: none;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            background: var(--available);
            color: var(--on-available);
        }

        .act.out {
            background: var(--occupied);
            color: var(--on-occupied);
        }

        .act:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .empty {
            color: var(--muted);
            font-size: 14px;
            padding: 4px 0;
        }

        dialog input {
            width: 100%;
            font: inherit;
            padding: 11px 12px;
            margin-bottom: 8px;
            background: var(--bg);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .newbox {
            display: grid;
            gap: 8px;
            margin-top: 8px;
        }

        .newbox input {
            margin-bottom: 0;
        }

        .opts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .opt {
            background: var(--c);
            color: var(--on);
            border: 0;
            border-radius: 10px;
            padding: 12px;
            font: inherit;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .opt[aria-pressed="true"] {
            outline: 3px solid var(--ink);
            outline-offset: 2px;
        }

        .cancel {
            margin-top: 16px;
            width: 100%;
            background: none;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            font: inherit;
            cursor: pointer;
        }

        .msg {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
        }

        #toast {
            position: fixed;
            inset: auto auto 20px 50%;
            margin: 0;
            border: 0;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 90vw;
            width: max-content;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }

        #toast.show {
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }

            .room:active {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <h1>Rooms</h1>
    <div class="legend" id="legend"></div>
    <div id="floors">
        <div class="msg">Loading rooms…</div>
    </div>

    <dialog id="sheet">
        <h3 id="sheet-title"></h3>
        <p class="sub" id="sheet-sub"></p>

        <h4>In this room</h4>
        <div class="list" id="in-room"></div>

        <h4>Add guest <small>recent logins, or search anyone</small></h4>
        <input id="q" type="search" placeholder="Search name, email or phone" autocomplete="off">
        <div class="list" id="recent"></div>
        <div id="newbox"></div>

        <h4>Room status</h4>
        <div class="opts" id="sheet-opts"></div>

        <button class="cancel" id="sheet-cancel" type="button">Close</button>
    </dialog>
    <div id="toast" role="status" aria-live="polite" popover="manual"></div>

    <script type="module">
        import { SB } from '../js/saser.js';

        const STATUSES = [
            { key: 'available', label: 'Available' },
            { key: 'occupied', label: 'Occupied' },
            { key: 'cleaning', label: 'Cleaning' },
            { key: 'maintenance', label: 'Maintenance' },
            { key: 'other', label: 'Other' },
        ];
        const LABEL = Object.fromEntries(STATUSES.map(s => [s.key, s.label]));
        const FLOOR_ORDER = ['Ground', 'First'];   // add 'Second', ... if you add floors
        const RECENT_HOURS = 3;

        const $ = (s) => document.querySelector(s);
        const el = (tag, props = {}, ...kids) => {
            const n = document.createElement(tag);
            Object.assign(n, props);
            kids.forEach(k => n.append(k));
            return n;
        };

        let rooms = [];
        let selected = null;     // room currently open in the popup
        let busy = false;

        const floorRank = (f) => { const i = FLOOR_ORDER.indexOf(f); return i === -1 ? 99 : i; };
        const floorTitle = (f) => (f === 'Unassigned' ? 'No floor set' : `${f} floor`);
        const ago = (iso) => {
            const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
            return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`;
        };

        /* ---------- board ---------- */
        function renderLegend() {
            $('#legend').replaceChildren(...STATUSES.map(s => {
                const n = rooms.filter(r => r.status === s.key).length;
                const chip = el('span', { className: 'chip' });
                chip.dataset.status = s.key;
                chip.append(el('i'), s.label + ' ', el('b', { textContent: n }));
                return chip;
            }));
        }

        function renderFloors() {
            const box = $('#floors');
            if (!rooms.length) {
                box.replaceChildren(el('div', { className: 'msg', textContent: 'No rooms found. Log in as the owner or staff of this hotel.' }));
                return;
            }
            const byFloor = {};
            rooms.forEach(r => (byFloor[r.floor || 'Unassigned'] ??= []).push(r));
            const names = Object.keys(byFloor).sort((a, b) => floorRank(a) - floorRank(b) || a.localeCompare(b));

            box.replaceChildren(...names.map(name => {
                const list = byFloor[name].sort((a, b) => a.room_number.localeCompare(b.room_number, undefined, { numeric: true }));
                const free = list.filter(r => r.status === 'available').length;

                const head = el('div', { className: 'floor-head' },
                    el('h2', { textContent: floorTitle(name) }),
                    el('span', { textContent: `${free} of ${list.length} available` }));

                const grid = el('div', { className: 'grid' }, ...list.map(r => {
                    const b = el('button', { className: 'room', type: 'button' },
                        el('span', { className: 'no', textContent: r.room_number }),
                        el('span', { className: 'type', textContent: r.room_type || '' }));
                    b.dataset.status = r.status;
                    b.setAttribute('aria-label', `Room ${r.room_number}, ${r.room_type || 'room'}, ${LABEL[r.status] || r.status}`);
                    b.onclick = () => openSheet(r);
                    return b;
                }));

                return el('section', { className: 'floor' }, head, grid);
            }));
        }

        function render() { renderLegend(); renderFloors(); }

        let toastTimer;
        function toast(msg) {
            const t = $('#toast');
            t.textContent = msg;
            if (!t.matches(':popover-open')) t.showPopover();   // shows above the open dialog
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.classList.remove('show'); t.hidePopover(); }, 3000);
        }

        /* ---------- popup ---------- */
        const row = (title, sub, btnText, onClick, { disabled = false, out = false } = {}) => {
            const b = el('button', { className: 'act' + (out ? ' out' : ''), type: 'button', textContent: btnText, disabled });
            b.onclick = onClick;
            return el('div', { className: 'row' },
                el('div', { className: 'who' }, el('b', { textContent: title }), el('span', { textContent: sub })), b);
        };
        const note = (t) => el('div', { className: 'empty', textContent: t });

        function paintHeader() {
            const r = selected;
            $('#sheet-title').textContent = `Room ${r.room_number}`;
            const bits = [r.room_type, r.base_rate != null ? `₹${Number(r.base_rate)}` : null,
            r.max_occupancy ? `sleeps ${r.max_occupancy}` : null].filter(Boolean);
            $('#sheet-sub').textContent = bits.join(', ');
            $('#sheet-opts').replaceChildren(...STATUSES.map(s => {
                const b = el('button', { className: 'opt', type: 'button', textContent: s.label });
                b.dataset.status = s.key;
                b.setAttribute('aria-pressed', r.status === s.key);
                b.onclick = () => setStatus(r, s.key);
                return b;
            }));
        }

        let paintTok = 0;
        async function paintLists() {
            const r = selected;
            const tok = ++paintTok;
            const q = $('#q').value.trim();
            const [g, u] = await Promise.all([
                SB.rpc('room_guests', { p_room_id: r.id }),
                q.length >= 2 ? SB.rpc('search_users', { p_q: q })
                    : SB.rpc('recent_logins', { p_hours: RECENT_HOURS }),
            ]);
            if (!selected || selected.id !== r.id || tok !== paintTok) return;   // closed, changed room, or newer keystroke

            const guests = g.data || [];
            $('#in-room').replaceChildren(...(g.error ? [note(g.error.message)]
                : guests.length ? guests.map(x => row(x.full_name, `checked in ${ago(x.check_in)}`, 'Check out', () => checkOut(x.guest_id), { out: true }))
                    : [note('Nobody checked in.')]));

            const full = r.max_occupancy && guests.length >= r.max_occupancy;
            const users = u.data || [];
            const searching = q.length >= 2;
            $('#recent').replaceChildren(...(u.error ? [note(u.error.message)]
                : users.length ? users.map(x => row(
                    x.full_name,
                    [x.phone || x.email, x.last_sign_in_at ? `logged in ${ago(x.last_sign_in_at)}` : 'never logged in'].filter(Boolean).join(', '),
                    full ? 'Full' : 'Add',
                    () => (x.app_user_id ? checkInApp(x.app_user_id) : checkIn(x.user_id)),
                    { disabled: full }))
                    : [note(searching ? 'Nobody found.' : `No one has logged in during the last ${RECENT_HOURS} hours. Search above.`)]));

            $('#newbox').replaceChildren(...(searching && !u.error && !users.length ? [newGuestBox(q, full)] : []));
        }

        function newGuestBox(q, full) {
            const isEmail = q.includes('@');
            const email = el('input', { type: 'email', placeholder: 'Email', value: isEmail ? q : '', autocomplete: 'off' });
            const name = el('input', { type: 'text', placeholder: 'Name (optional)', value: isEmail ? '' : q, autocomplete: 'off' });
            const btn = el('button', { className: 'act', type: 'button', textContent: full ? 'Room is full' : 'Save and add to room', disabled: !!full });
            btn.onclick = () => addNew(email.value.trim(), name.value.trim());
            return el('div', { className: 'newbox' }, note('Not found. Add as a new guest:'), email, name, btn);
        }

        async function addNew(email, name) {
            if (busy) return;
            if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Enter a valid email');
            busy = true;
            const a = await SB.rpc('add_manual_user', { p_email: email, p_full_name: name || null, p_phone: null });
            if (a.error) { busy = false; return toast(a.error.message); }
            const c = await SB.rpc('check_in_app_user', { p_room_id: selected.id, p_app_user_id: a.data });
            busy = false;
            if (c.error) return toast(c.error.message);
            $('#q').value = '';
            await afterChange(`Guest added to room ${selected.room_number}`);
        }

        async function checkInApp(appUserId) {
            if (busy) return; busy = true;
            const { error } = await SB.rpc('check_in_app_user', { p_room_id: selected.id, p_app_user_id: appUserId });
            busy = false;
            if (error) return toast(error.message);
            await afterChange(`Guest added to room ${selected.room_number}`);
        }

        let qTimer;
        $('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => selected && paintLists(), 300); });

        function openSheet(r) {
            selected = r;
            $('#q').value = '';
            $('#newbox').replaceChildren();
            paintHeader();
            $('#in-room').replaceChildren(note('Loading…'));
            $('#recent').replaceChildren(note('Loading…'));
            $('#sheet').showModal();
            paintLists();
        }
        const closeSheet = () => { selected = null; $('#sheet').close(); };
        $('#sheet-cancel').onclick = closeSheet;
        $('#sheet').addEventListener('close', () => { selected = null; });
        //$('#sheet').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeSheet(); });

        async function afterChange(msg) {
            if (msg.startsWith('Guest added')) $('#q').value = '';
            await load();
            if (selected) { selected = rooms.find(x => x.id === selected.id) || selected; paintHeader(); await paintLists(); }
            toast(msg);
        }

        async function checkIn(userId) {
            if (busy) return; busy = true;
            const { error } = await SB.rpc('check_in_guest', { p_room_id: selected.id, p_auth_user_id: userId });
            busy = false;
            if (error) return toast(error.message);
            await afterChange(`Guest added to room ${selected.room_number}`);
        }

        async function checkOut(guestId) {
            if (busy) return; busy = true;
            const { error } = await SB.rpc('check_out_guest', { p_guest_id: guestId });
            busy = false;
            if (error) return toast(error.message);
            await afterChange('Guest checked out');
        }

        async function setStatus(r, status) {
            if (r.status === status) return;
            const prev = r.status;
            r.status = status; render(); paintHeader();
            const { data, error } = await SB.from('rooms').update({ status }).eq('id', r.id).select('id');
            if (error || !data?.length) {
                r.status = prev; render(); paintHeader();
                toast(`Couldn't update room ${r.room_number}. ${error ? error.message : 'No permission.'}`);
            } else {
                toast(`Room ${r.room_number} is now ${LABEL[status].toLowerCase()}`);
            }
        }

        async function load() {
            const { data, error } = await SB.from('rooms')
                .select('id, room_number, room_type, floor, status, base_rate, max_occupancy');
            if (error) {
                $('#floors').replaceChildren(el('div', { className: 'msg', textContent: `Couldn't load rooms. ${error.message}` }));
                return;
            }
            rooms = data;
            render();
        }

        load();
        setInterval(() => { if (!$('#sheet').open) load(); }, 15000);
    </script>
</body>

</html>
