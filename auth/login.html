<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff login — Saser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#242119; --paper:#EFEADA; --brass:#AD803B; --pine:#33463A; --rust:#9C5A38;
    --line:rgba(36,33,25,0.14);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card{ width:100%; max-width:340px; padding:32px 28px; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:1.5rem; margin:0 0 6px; }
  p.sub{ color:#6b6656; font-size:0.9rem; margin:0 0 22px; }
  input{
    width:100%; padding:11px 12px; font-size:0.95rem;
    border:1px solid var(--line); border-radius:4px; background:#fff;
    margin-bottom:12px; font-family:'Work Sans', sans-serif;
  }
  button{
    width:100%; padding:11px 0; border:none; border-radius:4px;
    background:var(--pine); color:var(--paper);
    font-family:'Work Sans', sans-serif; font-size:0.9rem; font-weight:500; cursor:pointer;
  }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .error{ color:var(--rust); font-size:0.85rem; margin:-4px 0 12px; }
  .back{ display:inline-block; margin-top:16px; font-size:0.85rem; color:var(--brass); cursor:pointer; border-bottom:1px solid var(--brass); }
</style>
</head>
<body>

<div class="card">
  <h1>Staff login</h1>
  <p class="sub" id="sub">Enter your work email to get a code</p>

  <div id="step-email">
    <input type="email" id="email-input" placeholder="you@saser.in" autocomplete="email">
    <div class="error" id="email-error" style="display:none;"></div>
    <button id="send-btn">Send code</button>
  </div>

  <div id="step-otp" style="display:none;">
    <input type="text" id="otp-input" placeholder="6-digit code" inputmode="numeric" maxlength="6">
    <div class="error" id="otp-error" style="display:none;"></div>
    <button id="verify-btn">Verify and log in</button>
    <span class="back" id="back-link">Use a different email</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rysxztcnnfxtuikymvyd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_9F7WBGfcVF9lYrEx9x7l_w_8hjhNNmq";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const redirectTo = params.get('redirect') || 'kitchen.html';

  const el = id => document.getElementById(id);
  let currentEmail = '';

  el('send-btn').onclick = async () => {
    const email = el('email-input').value.trim();
    el('email-error').style.display = 'none';
    if (!email || !email.includes('@')) {
      el('email-error').textContent = 'Enter a valid email.';
      el('email-error').style.display = 'block';
      return;
    }
    el('send-btn').disabled = true;
    el('send-btn').textContent = 'Sending…';
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: false }
    });
    el('send-btn').disabled = false;
    el('send-btn').textContent = 'Send code';
    if (error) {
      el('email-error').textContent = error.message.includes('Signups not allowed')
        ? "That email isn't registered as staff."
        : error.message;
      el('email-error').style.display = 'block';
      return;
    }
    currentEmail = email;
    el('sub').textContent = `Code sent to ${email}`;
    el('step-email').style.display = 'none';
    el('step-otp').style.display = 'block';
  };

  el('verify-btn').onclick = async () => {
    const token = el('otp-input').value.trim();
    el('otp-error').style.display = 'none';
    if (!token || token.length < 6) {
      el('otp-error').textContent = 'Enter the 6-digit code.';
      el('otp-error').style.display = 'block';
      return;
    }
    el('verify-btn').disabled = true;
    el('verify-btn').textContent = 'Verifying…';
    const { error } = await supabase.auth.verifyOtp({
      email: currentEmail,
      token,
      type: 'email'
    });
    el('verify-btn').disabled = false;
    el('verify-btn').textContent = 'Verify and log in';
    if (error) {
      el('otp-error').textContent = 'Incorrect or expired code.';
      el('otp-error').style.display = 'block';
      return;
    }
    window.location.href = redirectTo;
  };

  el('back-link').onclick = () => {
    el('step-otp').style.display = 'none';
    el('step-email').style.display = 'block';
    el('sub').textContent = 'Enter your work email to get a code';
    el('otp-input').value = '';
  };
</script>

</body>
</html>
