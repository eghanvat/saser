<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff login — Saser</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/login.css">
  <script src="https://jsdelivr.net"></script>
  <script src="../js/supabase-client.js"></script>
</head>
<body>
  
<div class="card">
  <h1>Staff login</h1>
  <div id="loginContainer">
    <p class="sub" id="sub">Enter your work mobile number to get a code</p>
  
    <div id="emailLogin" style="display:none;">
      <input type="email" id="email" placeholder="Email">
      <div class="error" id="email-error" style="display:none;"></div>
      <button onclick="loginEmail()">Login</button>
    </div>
    
    <div id="mobileLogin" style="display:block;">
      <input type="tel" id="mobile" placeholder="Mobile (10 digits)">
      <div class="error" id="mobile-error" style="display:none;"></div>
      <button onclick="sendOtpS()">Send OTP</button>
    </div>
    
    <div id="otpInput" style="display:none;">
      <!-- Crucial: Captcha node container placed above the runtime scripts -->
      <div id="ass" style="margin-bottom: 10px;"></div>
      <input type="text" id="otp" placeholder="Enter 6-digit OTP">
      <div class="error" id="otp-error" style="display:none;"></div>
      <button onclick="verifyOtp()">Verify</button>
    </div>
    
    <button onclick="toggleMobileLogin()">Login with Email</button>
  </div>

  <div id="step-otp" style="display:none;">
    <input type="text" id="otp-input" placeholder="6-digit code" inputmode="numeric" maxlength="6">
    <div class="error" id="otp-error" style="display:none;"></div>
    <button id="verify-btn">Verify and log in</button>
    <span class="back" id="back-link">Use a different email</span>
  </div>
</div>

<!-- Scripts placed at the bottom to ensure DOM elements are fully loaded first -->
<!-- Scripts placed at the bottom to ensure DOM elements are fully loaded first -->
<script type="text/javascript">
  var configuration = {
    widgetId: "36696c6c7565333636333131",
    tokenAuth: "570513TSG5QcKsSq6aa545b2P1",
    exposeMethods: true,
    captchaRenderId: 'ass', // The unique ID of the target rendering container
      
    success: async (data) => {
      console.log('OTP verified successfully, token:', data);
    },
    failure: (error) => {
      console.log('OTP integration failed:', error);
      alert('OTP verification failed. Try again.');
    }
  };
    
  function sendOtpS() {
    var mobileInput = document.getElementById('mobile').value;
    if (!/^\d{10}$/.test(mobileInput)) {
      alert('Enter valid 10-digit mobile number');
      return;
    }
      
    // Format payload cleanly for MSG91 ingestion
    var formattedMobile = '91' + mobileInput.replace(/\D/g, '').slice(-10);
    console.log('Target mobile formatted:', formattedMobile);
      
    // Double check window context injection assignment status
    if (typeof window.sendOtp === "function") {
      // Per MSG91 guidelines: Pass the variable parameter string directly inside the global function
      window.sendOtp(
        formattedMobile, 
        (data) => {
           console.log('OTP API flow invoked successfully.', data);
           document.getElementById('otpInput').style.display = 'block';
        },
        (err) => {
           console.error('MSG91 Engine rejected the request.', err);
        }
      );
    } else {
      console.error("Method execution blocked: window.sendOtp is still undefined.");
    }
  }

  function verifyOtp() {
    var otpValue = document.getElementById('otp').value;
    
    if (typeof window.verifyOtp === "function") {
      window.verifyOtp(
        otpValue,
        (data) => console.log('OTP verification passed:', data),
        (err) => console.error('Verification failed:', err)
      );
    } else {
      console.error("window.verifyOtp is missing.");
    }
  }
</script>

<!-- FIXED: Removed the inline console string from onload to prevent parameter routing crashes -->
<script type="text/javascript" onload="initSendOTP(configuration)" src="https://verify.msg91.com/otp-provider.js"></script>
</body>
</html>
</body>
</html>
