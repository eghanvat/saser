<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff login — Saser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
</head>
<body>

<div class="card">
  <h1>Staff login</h1>
  <p class="sub" id="sub">Enter your work email to get a code</p>

  <div id="step-email">
    <input type="email" id="email-input" placeholder="you@saser.in" autocomplete="email">
    <div class="error" id="email-error" style="display:none;"></div>
    <button id="send-btn">Send code</button>
  </div>

  <div id="step-otp" style="display:none;">
    <input type="text" id="otp-input" placeholder="6-digit code" inputmode="numeric" maxlength="6">
    <div class="error" id="otp-error" style="display:none;"></div>
    <button id="verify-btn">Verify and log in</button>
    <span class="back" id="back-link">Use a different email</span>
  </div>
</div>

<script src="../js/login.js"></script>
</body>
</html>
