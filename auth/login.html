<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff login — Saser</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body>

  <div class="card">
    <h1>Staff login</h1>
    <div id="loginContainer">
      <!-- 
    <p class="sub" id="sub">Enter your work mobile number to get a code</p>-->

      <!-- Fixed: Fixed mismatched single quote on style attribute -->
      <div id="emailLogin" style="display:block;">
        <input type="email" id="email" placeholder="Email">
        <div class="error" id="email-error" style="display:none;"></div>
        <button id="send-btn">Login</button>
      </div>

      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="filled_blue" data-size="large"
        data-text="signin_with" data-width="284"> <!-- Set a specific pixel width to prevent it shifting shapes -->
      </div>

      <div id="g_id_onload" data-client_id="252529151792-gpbslbg857o3l1eecsehrglc4vnk28db.apps.googleusercontent.com"
        data-callback="handleCredentialResponse" data-auto_prompt="false">
      </div>

      <div class="g_signin2" data-type="standard"></div>


      <div id="mobileLogin" style="display:none;">
        <input type="tel" id="mobile" placeholder="Mobile (10 digits)">
        <div class="error" id="mobile-error" style="display:none;"></div>
        <button onclick="sendOtpS()">Send OTP</button>
      </div>

      <div id="otpInput" style="display:none;">
        <!-- Hidden container required by MSG91 when exposeMethods is active -->
        <div id="ass"></div>
        <input type="text" id="otp" placeholder="Enter 6-digit OTP">
        <div class="error" id="otp-error" style="display:none;"></div>
        <button onclick="verifyOtp()">Verify</button>
      </div>

      <!-- <button onclick="toggleMobileLogin()">Login with Email</button> -->
    </div>

    <div id="step-otp" style="display:none;">
      <input type="text" id="otp-input" placeholder="6-digit code" inputmode="numeric" maxlength="6">
      <div class="error" id="otp-error" style="display:none;"></div>
      <button id="verify-btn">Verify and log in</button>
      <span class="back" id="back-link">Use a different email</span>
    </div>
  </div>

  <script>
    // 4. Process the secure token after a user signs in
    async function handleCredentialResponse(response) {
      const { data, error } = await sb.auth.signInWithIdToken({
        provider: 'google',
        token: response.credential,
      })
      if (error) console.error(error)
      else console.log('Logged in:', data.user)
    }
  </script>
